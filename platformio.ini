[platformio]
# `pio run` builds only the release firmware; the other envs are verification-only.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv

# Pin the toolchain to Arduino core 3.2.1 / IDF 5.4 so every build is reproducible.
# Unpinned, `espressif32` floats: old platforms (core 2.x) fail to compile the ADC code
# (issue #12), and core 3.3.x frees BT controller memory at boot (see bleInUse() in
# BleAdapter.cpp). Core 3.2.1 compiles cleanly and is the build proven on hardware.
platform_packages =
	platformio/framework-arduinoespressif32@4.30201.0
	platformio/framework-arduinoespressif32-esp32-libs@3.2.1

# NimBLE-Arduino: lightweight BLE stack (~30-40KB less RAM than Bluedroid)
lib_deps = 
	# Exact pin: 1.4.x callback API (onConnect(server, desc)); 2.x is not source-compatible
	h2zero/NimBLE-Arduino@1.4.3

# PRODUCTION BUILD - SIZE OPTIMIZATIONS
build_flags = 
	# Debug level - increase for development (0 = no logs, 5 = max verbosity)
	-DCORE_DEBUG_LEVEL=3

	# C++17 required for inline variables and designated initializers
	-std=gnu++17
    
	# Size optimization instead of speed
	-Os
    
	# Remove unused functions/data sections
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
    
	# Disable unused Arduino features
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
    
	# C++ optimizations - we removed -fno-exceptions for stability
	# -fno-exceptions      # DISABLED - caused abort() and heap corruption
	# -fno-rtti            # DISABLED - for reliability
	-fno-threadsafe-statics  # Kept - safe
    
	# Additional optimizations
	-fmerge-all-constants
	-DDISABLE_ALL_LIBRARY_WARNINGS

	# NimBLE memory optimizations (disable unused roles for ~10KB extra savings)
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
	-DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
	-DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

	# NimBLE host task stack: increased from 4KB to 8KB to prevent
	# stack overflow when FileCommands runs SD/FATFS/SPI operations
	# inside BLE onWrite callback (see: Stack canary watchpoint triggered nimble_host)
	-DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192

	# Allow including headers colocated inside src/ (migration shim)
	-I src

# Override default C++ standard (platform adds -std=gnu++11)
build_unflags = 
	-std=gnu++11

# Exclude HttpsOTAUpdate.cpp (needs esp_https_ota.h, IDF-only)
extra_scripts = pre:filter_https_ota.py

# Disable unused libraries (Update kept for BLE OTA support)
lib_ignore = 
	HTTPUpdate

; monitor_filters = esp32_exception_decoder
; build_type = debug

monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
	time

# Verification-only build on the newest Arduino core (3.3.x / IDF 5.5) to prove the
# bleInUse() fix: this combination crash-looped before it. Not the release build.
[env:verify-core33]
extends = env:esp32dev
platform_packages =

# Emulator (QEMU) builds — verification only. QEMU has no ADC, so battery reads would hang.
[env:emu-321]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags}
	-DBATTERY_MODULE_ENABLED=0

[env:emu-33]
extends = env:verify-core33
build_flags = ${env:esp32dev.build_flags}
	-DBATTERY_MODULE_ENABLED=0

# Bench diagnostic build — runs SelfTest::run() once at boot then halts.
# Flash to a bench Crow only; reflash esp32dev to restore. Not the release build.
[env:esp32dev-selftest]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags}
	-DSELFTEST_ON_BOOT=1
